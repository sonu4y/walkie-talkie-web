name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'

permissions:
  contents: write

jobs:
  exe:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: electron
        run: npm install --no-audit --no-fund

      - name: Bundle web app
        working-directory: electron
        run: |
          mkdir -p www
          cp ../index.html ../config.js www/

      - name: Build installer
        working-directory: electron
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --win --publish never

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: voice-room-windows
          path: electron/dist/VoiceRoom-Setup.exe

      - name: Publish release with installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "win-${{ github.run_number }}" electron/dist/VoiceRoom-Setup.exe \
            --title "Windows installer build ${{ github.run_number }}" \
            --notes "Windows installer built from commit ${{ github.sha }}. Run it; if Windows SmartScreen warns, click More info, then Run anyway (the app is not code-signed)."
